{% extends "base.html" %}

{% block page_title %}Add Fund Movement{% endblock %}

{% block content %}

<div class="panel" style="max-width: 540px;">
  <div class="panel-title">Record Fund Movement</div>
  <form method="post">
    <input type="hidden" name="next_url" value="{{ next_url }}">

    <label for="account">Account</label>
    <input type="text" id="account" name="account" required placeholder="Binance">

    <label for="symbol">Symbol</label>
    <input type="text" id="symbol" name="symbol" required placeholder="__USD_CASH__">

    <label for="movement_date">Date (YYYY-MM-DD)</label>
    <input type="text" id="movement_date" name="movement_date" required placeholder="2026-04-18">

    <label for="movement_type">Type</label>
    <select id="movement_type" name="movement_type" required>
      <option value="CONTRIBUTION">CONTRIBUTION</option>
      <option value="WITHDRAWAL">WITHDRAWAL</option>
    </select>

    <label for="amount">Amount (in selected currency)</label>
    <input type="text" id="amount" name="amount" required placeholder="1000">

    <label for="currency">Currency (required)</label>
    <select id="currency" name="currency" required>
      <option value="" disabled selected>-- Select currency --</option>
      <option value="USD">USD</option>
      <option value="COP">COP</option>
    </select>

    <label for="fx_rate">FX Rate (units of currency per 1 USD, required for COP)</label>
    <input type="text" id="fx_rate" name="fx_rate" placeholder="4000.00">

    <label for="notes">Notes (optional)</label>
    <input type="text" id="notes" name="notes">

    <button type="submit">Record Fund Movement</button>
    <a href="{{ url_for('gui.operations') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>

{% endblock %}
