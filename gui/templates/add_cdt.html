{% extends "base.html" %}

{% block page_title %}Add CDT{% endblock %}

{% block content %}

<div class="panel" style="max-width: 540px;">
  <div class="panel-title">Record CDT Contract</div>
  <form method="post">
    <input type="hidden" name="next_url" value="{{ next_url }}">
    <input type="hidden" name="review" value="1">

    <label for="account">Account</label>
    <input type="text" id="account" name="account" required placeholder="BBVA">

    <label for="symbol">Symbol (default: BBVA CDT)</label>
    <input type="text" id="symbol" name="symbol" value="BBVA CDT">

    <label for="open_date">Open Date (YYYY-MM-DD)</label>
    <input type="text" id="open_date" name="open_date" required placeholder="2026-01-15">

    <label for="maturity_date">Maturity Date (YYYY-MM-DD)</label>
    <input type="text" id="maturity_date" name="maturity_date" required placeholder="2027-01-15">

    <label for="principal">Principal (in selected currency)</label>
    <input type="text" id="principal" name="principal" required placeholder="10000000">

    <label for="currency">Currency (required)</label>
    <select id="currency" name="currency" required>
      <option value="" disabled selected>-- Select currency --</option>
      <option value="USD">USD</option>
      <option value="COP">COP</option>
    </select>

    <label for="fx_rate_at_open">FX Rate at Open (units of currency per 1 USD, required for COP)</label>
    <input type="text" id="fx_rate_at_open" name="fx_rate_at_open" placeholder="4000.00">

    <label for="annual_rate">Annual Rate (decimal, e.g. 0.10 = 10%)</label>
    <input type="text" id="annual_rate" name="annual_rate" required placeholder="0.10">

    <label for="term_years">Term in Years (optional)</label>
    <input type="text" id="term_years" name="term_years" placeholder="1.0">

    <label for="notes">Notes (optional)</label>
    <input type="text" id="notes" name="notes">

    <button type="submit">Continue / Review</button>
    <a href="{{ url_for('gui.operations') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>

{% endblock %}
