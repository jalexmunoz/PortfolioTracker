{% extends "base.html" %}

{% block page_title %}Add Cash Movement{% endblock %}

{% block content %}

<div class="panel" style="max-width: 540px;">
  <div class="panel-title">Record Cash Deposit / Withdrawal</div>
  <p class="muted" style="margin-top: 0;">Cash deposits and withdrawals only move cash. They do not create a position and do not affect PnL.</p>
  <form method="post">
    <input type="hidden" name="next_url" value="{{ next_url }}">
    <input type="hidden" name="review" value="1">

    <label for="account">Account</label>
    <input type="text" id="account" name="account" required placeholder="Vanguard">

    <label for="movement_date">Date (YYYY-MM-DD)</label>
    <input type="text" id="movement_date" name="movement_date" required placeholder="2026-04-18">

    <label for="movement_type">Type</label>
    <select id="movement_type" name="movement_type" required>
      <option value="DEPOSIT">DEPOSIT</option>
      <option value="WITHDRAWAL">WITHDRAWAL</option>
    </select>

    <label for="amount">Amount (USD)</label>
    <input type="text" id="amount" name="amount" required placeholder="25000">

    <label for="notes">Notes (optional)</label>
    <input type="text" id="notes" name="notes">

    <button type="submit">Continue / Review</button>
    <a href="{{ url_for('gui.operations') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>

{% endblock %}
