{% extends "base.html" %}

{% block page_title %}Initialize Database{% endblock %}

{% block content %}

<div class="panel" style="max-width: 620px;">
  <div class="panel-title">Initialize Schema</div>
  <p>Initialize schema and default assets on:</p>
  <p><code>{{ active.db_path }}</code></p>
  <form method="post">
    <input type="hidden" name="next_url" value="{{ next_url }}">
    <button type="submit">Initialize Database</button>
    <a href="{{ url_for('gui.setup') }}" class="btn btn-secondary">Back to Setup</a>
  </form>
</div>

{% endblock %}
